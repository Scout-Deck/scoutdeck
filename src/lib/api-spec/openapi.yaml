openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: opportunities
  - name: profile
  - name: saved
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List ranked opportunities
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: userSubmittedOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Opportunity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: submitOpportunity
      tags: [opportunities]
      summary: Submit an opportunity URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Submitted opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get opportunity details
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404":
          description: Not found
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /saved:
    get:
      operationId: listSavedOpportunities
      tags: [saved]
      summary: List saved opportunities
      responses:
        "200":
          description: Saved opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
  /saved/{id}:
    put:
      operationId: saveOpportunity
      tags: [saved]
      summary: Save an opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "204":
          description: Saved
    delete:
      operationId: unsaveOpportunity
      tags: [saved]
      summary: Remove a saved opportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "204":
          description: Removed
components:
  parameters:
    OpportunityId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Opportunity:
      type: object
      required: [id, title, organization, summary, sourceUrl, type, score, why, deadline, compensation, sourceType, requiredSkills, eligibility, isSaved]
      properties:
        id: { type: string }
        title: { type: string }
        organization: { type: string }
        summary: { type: string }
        sourceUrl: { type: string }
        type:
          type: string
          enum: [fellowship, builder_program, ambassador_program, hackathon, scholarship, grant]
        score: { type: number, minimum: 0, maximum: 100 }
        why: { type: string }
        deadline: { type: ["string", "null"] }
        compensation: { type: ["string", "null"] }
        sourceType:
          type: string
          enum: [scraped, user_submitted]
        requiredSkills:
          type: array
          items: { type: string }
        eligibility:
          $ref: "#/components/schemas/Eligibility"
        isSaved: { type: boolean }
    Eligibility:
      type: object
      required: [educationLevel, experience, location, remoteOk, otherCriteria]
      properties:
        educationLevel: { type: string }
        experience: { type: string }
        location: { type: string }
        remoteOk: { type: boolean }
        otherCriteria: { type: string }
    OpportunityInput:
      type: object
      required: [url, type]
      properties:
        url: { type: string, format: uri }
        type:
          type: string
          enum: [fellowship, builder_program, ambassador_program, hackathon, scholarship, grant]
        notes: { type: string }
    Profile:
      type: object
      required: [name, educationLevel, fieldOfStudy, skills, interests, location, remoteOk, opportunityTypes, experienceLevel]
      properties:
        name: { type: string }
        educationLevel: { type: string }
        fieldOfStudy: { type: string }
        skills:
          type: array
          items: { type: string }
        interests: { type: string }
        location: { type: string }
        remoteOk: { type: boolean }
        opportunityTypes:
          type: array
          items:
            type: string
            enum: [fellowship, builder_program, ambassador_program, hackathon, scholarship, grant]
        experienceLevel:
          type: string
          enum: [student, recent_grad, early_career]
    ProfileInput:
      type: object
      properties:
        name: { type: string }
        educationLevel: { type: string }
        fieldOfStudy: { type: string }
        skills:
          type: array
          items: { type: string }
        interests: { type: string }
        location: { type: string }
        remoteOk: { type: boolean }
        opportunityTypes:
          type: array
          items:
            type: string
            enum: [fellowship, builder_program, ambassador_program, hackathon, scholarship, grant]
        experienceLevel:
          type: string
          enum: [student, recent_grad, early_career]
